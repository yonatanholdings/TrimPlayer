# Robolectric's simulated SDK. Pinned because 4.14 ships no API 36 shadows, so
# letting it follow compileSdk/targetSdk breaks every Robolectric test.
sdk=34

# Unit tests must not boot a custom Application. In the app module that is
# PodcastApp, whose onCreate() calls scheduleTrimEventsUpload() ->
# WorkManager.getInstance(), which throws "WorkManager is not initialized
# properly" under Robolectric and fails every test in the module before its
# first line runs. ShownotesCleanerTest (16) and FeedDiscovererTest (7) had
# been red for exactly that reason.
#
# Only the app module declares an Application subclass, so for every other
# module this is already the effective default and nothing changes.
application=android.app.Application
